name: TW Stock Watch

on:
  schedule:
    - cron: "*/5 1-5 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated state (避免重複通知)
        run: |
          git config user.name "tw-stock-bot"
          git config user.email "actions@github.com"
          git add state/ || true
          git diff --cached --quiet || git commit -m "update alert state [skip ci]"
          git push || true
